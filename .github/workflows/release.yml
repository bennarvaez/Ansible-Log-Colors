name: Release

# Push a tag like v0.1.0 (matching "version" in package.json) to build the
# .vsix and publish it as a GitHub release. If a VSCE_PAT secret exists, the
# same build is also published to the VS Code Marketplace.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"
            exit 1
          fi

      - name: Package
        run: npx vsce package --no-dependencies -o ansible-log-colors-${GITHUB_REF_NAME#v}.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" *.vsix \
            --title "${GITHUB_REF_NAME}" \
            --notes "$(awk '/^## /{if(f)exit; if($2==v)f=1; next} f' v="${GITHUB_REF_NAME#v}" CHANGELOG.md)"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath *.vsix
